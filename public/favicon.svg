<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Sky Ambient Glow -->
    <radialGradient id="skyGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Red Beacon Glow -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Squircle App Badge Backdrop -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#skyGlow)" />

  <!-- 2. Isometric Base Voxel Foundation Slab -->
  <!-- Soil Side Left -->
  <polygon points="12,44 32,54 32,59 12,49" fill="#15803d" />
  <!-- Soil Side Right -->
  <polygon points="32,54 52,44 52,49 32,59" fill="#0f5132" />
  <!-- Grass Top Diamond -->
  <polygon points="32,34 52,44 32,54 12,44" fill="#22c55e" />

  <!-- 3. Asphalt Roadway Across Front-Right -->
  <polygon points="32,54 44,48 49,50.5 37,56.5" fill="#334155" />
  <polygon points="37,56.5 49,50.5 49,52.5 37,58.5" fill="#1e293b" />
  <!-- Dashed Yellow Road Markings -->
  <polygon points="36,52.2 39.5,50.4 40.5,50.9 37,52.7" fill="#facc15" />
  <polygon points="42,49.2 45.5,47.4 46.5,47.9 43,49.7" fill="#facc15" />

  <!-- 4. Left Building: Residential Voxel Townhouse with Terracotta Roof -->
  <!-- Left Wall -->
  <polygon points="14,29 21,32.5 21,43 14,39.5" fill="#f8fafc" />
  <!-- Right Wall (Shaded) -->
  <polygon points="21,32.5 28,29 28,39.5 21,43" fill="#cbd5e1" />
  <!-- Door & Windows -->
  <rect x="16" y="32" width="2" height="3" fill="#38bdf8" />
  <rect x="16" y="36.5" width="2.5" height="3" fill="#b45309" />
  <rect x="23" y="32" width="2.5" height="2.5" fill="#38bdf8" />
  <!-- Terracotta Pitched Roof -->
  <polygon points="13,29 21,24 21,32.5 13,29" fill="#ef4444" />
  <polygon points="21,24 29,29 21,32.5 21,24" fill="#b91c1c" />

  <!-- 5. Center-Right Building: TheoTown Glass Skyscraper -->
  <!-- Left Facade (Direct Light) -->
  <polygon points="27,15 36,19.5 36,41 27,36.5" fill="#0284c7" />
  <!-- Right Facade (Shadow) -->
  <polygon points="36,19.5 45,15 45,36.5 36,41" fill="#0369a1" />
  <!-- Roof Top Slab -->
  <polygon points="36,10.5 45,15 36,19.5 27,15" fill="#38bdf8" />
  <!-- Rooftop Elevator Penthouse / Helipad -->
  <polygon points="36,12.5 41,15 36,17.5 31,15" fill="#0ea5e9" />

  <!-- Glowing Golden & Cyan Voxel Windows (Left Facade) -->
  <polygon points="29,20 31,21 31,23 29,22" fill="#fde047" />
  <polygon points="33,22 35,23 35,25 33,24" fill="#fde047" />
  <polygon points="29,25 31,26 31,28 29,27" fill="#fde047" />
  <polygon points="33,27 35,28 35,30 33,29" fill="#38bdf8" />
  <polygon points="29,30 31,31 31,33 29,32" fill="#38bdf8" />
  <polygon points="33,32 35,33 35,35 33,34" fill="#fde047" />

  <!-- Window Reflections (Right Facade) -->
  <polygon points="38,22 40,21 40,23 38,24" fill="#fde047" opacity="0.85" />
  <polygon points="42,20 44,19 44,21 42,22" fill="#38bdf8" opacity="0.85" />
  <polygon points="38,27 40,26 40,28 38,29" fill="#fde047" opacity="0.85" />
  <polygon points="38,32 40,31 40,33 38,34" fill="#fde047" opacity="0.85" />

  <!-- Rooftop Antenna Spire & Blinking Aviation Beacon -->
  <line x1="36" y1="10.5" x2="36" y2="4" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="36" cy="4" r="1.8" fill="#ef4444" filter="url(#beaconGlow)" />
  <circle cx="36" cy="4" r="0.9" fill="#ffffff" />

  <!-- 6. Voxel Evergreen Pine Tree (Front Left) -->
  <line x1="18" y1="49" x2="18" y2="44" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <!-- Bottom Skirt -->
  <polygon points="18,40 22,42 18,44 14,42" fill="#14532d" />
  <!-- Mid Tier -->
  <polygon points="18,37 21,38.5 18,40 15,38.5" fill="#166534" />
  <!-- Top Needle Spire -->
  <polygon points="18,34 20,35 18,36 16,35" fill="#22c55e" />

  <!-- 7. Tiny Voxel Yellow Taxi / Sports Car (On Road) -->
  <polygon points="39,47 43,45 44,45.5 40,47.5" fill="#f59e0b" />
  <polygon points="40,47.5 44,45.5 44,47 40,49" fill="#d97706" />
  <polygon points="41,46 42.5,45.2 42.8,45.8 41.3,46.6" fill="#38bdf8" />
  <!-- Wheels -->
  <circle cx="40.5" cy="48.5" r="0.8" fill="#0f172a" />
  <circle cx="43.5" cy="47" r="0.8" fill="#0f172a" />

  <!-- 8. Sky Sparkles / City Lights Accents -->
  <polygon points="52,11 53,13 55,14 53,15 52,17 51,15 49,14 51,13" fill="#38bdf8" opacity="0.85" />
  <polygon points="12,15 12.8,16.2 14,17 12.8,17.8 12,19 11.2,17.8 10,17 11.2,16.2" fill="#facc15" opacity="0.75" />
</svg>
